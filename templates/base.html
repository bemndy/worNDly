<!-- bootstrap, head setup for all interior pages -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}worNDly{% endblock %}</title>
</head>
<body>

    <!-- Logo styling and html -->
    <div class="text-center" style="overflow: hidden; height: 220px;">
        <img src="{% static 'images/worNDly_logo_transparent.png' %}" alt="worNDly" style="height: 300px; display: block; margin: 0 auto; transform: translateY(-50px);">
    </div>


    {% block content %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
